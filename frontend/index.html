<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Hospital Universitário — Consulta de Prontuário</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
  h1 { font-size: 1.4rem; }
  fieldset { margin-bottom: 20px; border-radius: 8px; }
  label { display: block; margin: 8px 0 4px; font-size: 0.85rem; color: #555; }
  input, select { padding: 6px 8px; width: 100%; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.55; }
  pre { background: #f4f4f8; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .status { margin-top: 10px; color: #555; font-size: 0.9rem; }
  .FULL { background: #d1fae5; color: #065f46; }
  .PARTIAL { background: #fef3c7; color: #92400e; }
  .ANONYMIZED { background: #dbeafe; color: #1e40af; }
  .AGGREGATED { background: #ede9fe; color: #5b21b6; }
  .error { background: #fee2e2; color: #991b1b; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>🏥 Hospital Universitário — Consulta de Prontuário (HL7/FHIR)</h1>

  <fieldset>
    <legend>Autenticação</legend>
    <div class="row">
      <div>
        <label>Gateway URL</label>
        <input id="gatewayUrl" value="https://kiriland.unb.br/grupo6" />
      </div>
      <div>
        <label>Keycloak URL</label>
        <input id="keycloakUrl" value="https://kiriland.unb.br/keycloak" />
      </div>
    </div>
    <div class="actions">
      <button id="loginBtn" onclick="login()">Login Keycloak</button>
      <button id="logoutBtn" onclick="logout()" disabled>Sair</button>
    </div>
    <div id="authStatus" class="status">Não autenticado</div>
  </fieldset>

  <fieldset id="patientFields">
    <legend>Consulta por paciente (médico/estagiário)</legend>
    <label>Patient ID</label>
    <input id="patientId" value="P000001" />
    <button onclick="consultaResumo()">Resumo Clínico</button>
    <button onclick="consultaHistorico()">Histórico Clínico</button>
  </fieldset>

  <fieldset id="researchFields">
    <legend>Consulta de coorte (pesquisador)</legend>
    <label>Project ID</label>
    <input id="projectId" value="1" />
    <button onclick="consultaEstatisticas()">Estatísticas Agregadas</button>
    <button onclick="consultaExames()">Exames da Coorte (anonimizado)</button>
  </fieldset>

  <h3>Resultado</h3>
  <div id="badge"></div>
  <pre id="result">—</pre>

<script>
const CLIENT_ID = "hospital-frontend";
const REALM = "grupo06";
let auth = loadAuth();

function gw() { return document.getElementById("gatewayUrl").value.replace(/\/$/, ""); }
function kc() { return document.getElementById("keycloakUrl").value.replace(/\/$/, ""); }
function redirectUri() { return `${location.origin}${location.pathname}`; }

function loadConfig() {
  const config = JSON.parse(sessionStorage.getItem("hospital_frontend_config") || "{}");
  if (config.gatewayUrl) document.getElementById("gatewayUrl").value = config.gatewayUrl;
  if (config.keycloakUrl) document.getElementById("keycloakUrl").value = config.keycloakUrl;
}

function saveConfig() {
  sessionStorage.setItem("hospital_frontend_config", JSON.stringify({
    gatewayUrl: gw(),
    keycloakUrl: kc(),
  }));
}

function loadAuth() {
  const raw = sessionStorage.getItem("hospital_auth");
  return raw ? JSON.parse(raw) : null;
}

function saveAuth(nextAuth) {
  auth = nextAuth;
  if (auth) sessionStorage.setItem("hospital_auth", JSON.stringify(auth));
  else sessionStorage.removeItem("hospital_auth");
  renderAuth();
}

function base64Url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function sha256(value) {
  const data = new TextEncoder().encode(value);
  return crypto.subtle.digest("SHA-256", data);
}

function randomString() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64Url(bytes);
}

function parseJwt(token) {
  const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(decodeURIComponent(escape(atob(payload))));
}

async function login() {
  saveConfig();
  const verifier = randomString();
  const state = randomString();
  sessionStorage.setItem("pkce_verifier", verifier);
  sessionStorage.setItem("oauth_state", state);

  const challenge = base64Url(await sha256(verifier));
  const url = new URL(`${kc()}/realms/${REALM}/protocol/openid-connect/auth`);
  url.searchParams.set("client_id", CLIENT_ID);
  url.searchParams.set("redirect_uri", redirectUri());
  url.searchParams.set("response_type", "code");
  url.searchParams.set("scope", "openid profile");
  url.searchParams.set("state", state);
  url.searchParams.set("code_challenge", challenge);
  url.searchParams.set("code_challenge_method", "S256");
  location.href = url.toString();
}

async function finishLoginIfNeeded() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if (!code) return;

  const state = params.get("state");
  if (state !== sessionStorage.getItem("oauth_state")) {
    throw new Error("Estado OAuth inválido");
  }

  const body = new URLSearchParams();
  body.set("grant_type", "authorization_code");
  body.set("client_id", CLIENT_ID);
  body.set("redirect_uri", redirectUri());
  body.set("code", code);
  body.set("code_verifier", sessionStorage.getItem("pkce_verifier"));

  const res = await fetch(`${kc()}/realms/${REALM}/protocol/openid-connect/token`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  if (!res.ok) throw new Error(`Falha ao trocar token: HTTP ${res.status}`);

  const token = await res.json();
  const claims = parseJwt(token.access_token);
  saveAuth({
    accessToken: token.access_token,
    refreshToken: token.refresh_token,
    username: claims.preferred_username || claims.sub,
    roles: claims.realm_access?.roles || [],
  });
  history.replaceState({}, document.title, redirectUri());
}

function logout() {
  const keycloakUrl = kc();
  saveAuth(null);
  const url = new URL(`${keycloakUrl}/realms/${REALM}/protocol/openid-connect/logout`);
  url.searchParams.set("client_id", CLIENT_ID);
  url.searchParams.set("post_logout_redirect_uri", redirectUri());
  location.href = url.toString();
}

function headers() {
  return auth ? { "Authorization": `Bearer ${auth.accessToken}` } : {};
}

async function call(path) {
  const badge = document.getElementById("badge");
  const result = document.getElementById("result");
  badge.innerHTML = "";
  if (!auth) {
    badge.innerHTML = `<span class="badge error">não autenticado</span>`;
    result.textContent = "Faça login no Keycloak antes de consultar.";
    return;
  }
  result.textContent = "Carregando...";
  try {
    const res = await fetch(`${gw()}${path}`, { headers: headers() });
    const data = await res.json();
    if (data.accessLevel) {
      badge.innerHTML = `<span class="badge ${data.accessLevel}">${data.accessLevel}</span>`;
    } else if (data.error) {
      badge.innerHTML = `<span class="badge error">${data.error}</span>`;
    }
    result.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    badge.innerHTML = `<span class="badge error">network error</span>`;
    result.textContent = String(err);
  }
}

function consultaResumo() {
  call(`/api/patients/${document.getElementById("patientId").value}/resumo-clinico`);
}
function consultaHistorico() {
  call(`/api/patients/${document.getElementById("patientId").value}/historico-clinico`);
}
function consultaEstatisticas() {
  call(`/api/coorte/${document.getElementById("projectId").value}/estatisticas`);
}
function consultaExames() {
  call(`/api/coorte/${document.getElementById("projectId").value}/exames`);
}

function renderAuth() {
  const authenticated = Boolean(auth);
  document.getElementById("loginBtn").disabled = authenticated;
  document.getElementById("logoutBtn").disabled = !authenticated;
  document.getElementById("authStatus").textContent = authenticated
    ? `Autenticado como ${auth.username} (${auth.roles.join(", ") || "sem role"})`
    : "Não autenticado";
}

loadConfig();
document.getElementById("gatewayUrl").addEventListener("change", saveConfig);
document.getElementById("keycloakUrl").addEventListener("change", saveConfig);

finishLoginIfNeeded()
  .catch((err) => {
    document.getElementById("badge").innerHTML = `<span class="badge error">auth error</span>`;
    document.getElementById("result").textContent = String(err);
  })
  .finally(renderAuth);
</script>
</body>
</html>
