apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: grupo-6
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: hospital/api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_MODE
              value: "keycloak"
            - name: KEYCLOAK_ISSUER
              value: "https://kiriland.unb.br/keycloak/realms/grupo06"
            - name: AUTHZ_ADDR
              value: "authorization-service:50051"
            - name: PATIENT_DATA_ADDR
              value: "patient-data-service:50052"
            - name: TRANSFORM_ADDR
              value: "data-transform-service:50053"
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "150m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: grupo-6
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
