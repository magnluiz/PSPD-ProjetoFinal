# Requires the metrics-server addon (e.g. `minikube addons enable metrics-server`)
# HPA scales on CPU utilization. Critical API path services keep a warm
# baseline because the project load-test stages are short; waiting for a cold
# 1-3 pod deployment to scale causes p95 spikes before the HPA reacts.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: grupo-6
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 6
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 15
---
